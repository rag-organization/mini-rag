name: deploy main branch to server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step to pull down the repository code
      # Take my repository from GitHub and put the code inside the GitHub Actions runner so the following steps can work with it.
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      # Connect from the GitHub Actions runner to your server using SSH and execute commands there.
      # A GitHub Actions runner is a temporary computer (virtual machine) provided by GitHub that executes your workflow.
      - name: Deploy via ssh
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{secrets.SSH_MAIN_HOST_IP}}
          username: github_user
          key: ${{secrets.SSH_MAIN_PRIVATE_KEY}}
          script: |
            cd /home/github_user/workspace/mini-rag
            git switch main
            git pull
            sudo systemctl restart rag.service
            echo "waiting..."
            sleep 20

            for i in {1..6}; do
              if ss -tuln | grep -q ':80'; then
                echo "✅ Port 80 is now active."
                break
              else
                echo "⏳ Port 80 not ready yet. Retrying in 5 seconds..."
                sleep 5
              fi
            done

            if ! ss -tuln | grep -q ':80'; then
              echo "❌ Service failed to start on port 80"
              exit 1
            fi